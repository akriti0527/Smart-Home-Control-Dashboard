<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Home Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="script.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-emerald-500 text-white p-4 text-center shadow-md">
    <h1 class="text-3xl font-bold">🏠 Smart Home Dashboard</h1>
    <p class="text-sm mt-1" id="datetime"></p>
  </header>

  <!-- Main Dashboard -->
  <main class="container mx-auto p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <!-- Lights -->
    <section class="card">
      <h2 class="card-title">💡 Lights</h2>
      <label class="toggle-group">
        <span>Living Room</span>
        <input type="checkbox" id="light-living" class="toggle-checkbox"/>
      </label>
      <label class="toggle-group">
        <span>Kitchen</span>
        <input type="checkbox" id="light-kitchen" class="toggle-checkbox"/>
      </label>
    </section>

    <!-- Thermostat -->
    <section class="card">
      <h2 class="card-title">🌡️ Thermostat</h2>
      <div class="flex items-center space-x-4">
        <button id="decrease-temp" class="btn">-</button>
        <span id="temperature" class="text-2xl font-bold">22°C</span>
        <button id="increase-temp" class="btn">+</button>
      </div>
    </section>

    <!-- Security -->
    <section class="card">
      <h2 class="card-title">🔒 Security System</h2>
      <label class="toggle-group">
        <span>System Armed</span>
        <input type="checkbox" id="security-toggle" class="toggle-checkbox"/>
      </label>
    </section>

    <!-- Smart TV -->
    <section class="card">
      <h2 class="card-title">📺 Smart TV</h2>
      <label class="toggle-group">
        <span>Power</span>
        <input type="checkbox" id="tv-power" class="toggle-checkbox"/>
      </label>
      <label class="block mt-4">
        <span class="block mb-1">Volume</span>
        <input type="range" id="tv-volume" min="0" max="100" value="20" class="w-full" />
      </label>
    </section>

    <!-- Speakers -->
    <section class="card">
      <h2 class="card-title">🔈 Speakers</h2>
      <label class="block mt-2">
        <span class="block mb-1">Volume</span>
        <input type="range" id="speaker-volume" min="0" max="100" value="30" class="w-full" />
      </label>
      <div class="flex gap-4 mt-4">
        <button class="btn">⏮️</button>
        <button class="btn">▶️</button>
        <button class="btn">⏭️</button>
      </div>
    </section>

    <!-- Weather -->
    <section class="card">
      <h2 class="card-title">🌦️ Weather</h2>
      <div class="text-lg mt-2" id="weather">
        <p>Loading weather...</p>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-gray-200 text-center p-4 text-sm mt-8">
    &copy; 2025 SmartHome Inc. All rights reserved.
  </footer>

</body>
</html>
